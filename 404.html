    background: radial-gradient(ellipse at center, #1a0d10 0%, #070708 60%, #000 100%); overflow-x: hidden; }

  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 10;

  .over { filter: drop-shadow(0 0 8px rgba(242,242,240,.25)); }

  .start { display: inline-block; padding: 12px 22px; border: 3px solid #F2F2F0; background: #E5484D; color: #fff; text-decoration: none;

  .start:hover, .start:focus-visible { animation: none; background: #ff5a60; outline: none; }
  form { width: 100%; display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; height: 46px; padding: 0 14px; border: 3px solid #4a4a52; background: #0E0E10; color: #F2F2F0;
    font: 15px 'Courier New', monospace; letter-spacing: .06em; text-transform: uppercase; border-radius: 0; }
  input:focus { outline: none; border-color: #F5C443; }
  input::placeholder { color: #6E6E76; }
  button { height: 46px; padding: 0 16px; border: 3px solid #F2F2F0; background: #1A1A1E; color: #F2F2F0; cursor: pointer;
    font: bold 14px 'Courier New', monospace; letter-spacing: .1em; box-shadow: 4px 4px 0 #333; }
  button:hover { background: #F5C443; color: #000; }
  nav { font-size: 13px; color: #6E6E76; }
  nav a { color: #F5C443; }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .85; } 48% { opacity: 1; } 91% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }

  function pixelText(text, px, fill, shadow) {
  let x = 0, rects = '';
  for (const ch of text) {
    const g = FONT[ch] || FONT[' '];
    g.forEach((row, y) => [...row].forEach((on, i) => {
      if (on === '1') rects += `<rect x="${x + i}" y="${y}" width="1" height="1"/>`;
    }));
    x += g[0].length + 1;
  }
  const w = x - 1;
  const body = `<g fill="${fill}">${rects}</g>`;
  const back = shadow ? `<g fill="${shadow}" transform="translate(.5 .5)">${rects}</g>` : '';
  return `<svg viewBox="0 0 ${w + 0.5} 7.5" width="${(w + 0.5) * px}" height="${7.5 * px}" shape-rendering="crispEdges" aria-hidden="true">${back}${body}</svg>`;
}
